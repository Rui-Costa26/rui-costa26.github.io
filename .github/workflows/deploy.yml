name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build   # includes scripts/check-dist.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  legal-pages:
    # The App Store listings link to these; fail loudly if any stops answering.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - run: |
          sleep 30
          for u in fruidoku-legal/ fruidoku-legal/privacy.html formly-legal/ formly-legal/privacy.html formly-legal/privacy-pt.html app-ads.txt; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://rui-costa26.github.io/$u")
            echo "$code $u"; [ "$code" = 200 ] || exit 1
          done
